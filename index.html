<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACT 401: Survival Models Tracker</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ACT 401">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3413/3413535.png">

    <!-- Fonts & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(22, 30, 49, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .item-row {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-row:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }
        .item-row.completed {
            background: rgba(79, 70, 229, 0.12);
            border-color: rgba(99, 102, 241, 0.35);
        }
    </style>
</head>
<body class="p-4 sm:p-6 pb-20 max-w-xl mx-auto selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation / Install & Notification Actions -->
    <div class="flex items-center justify-between py-3 mb-4">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-xs font-black shadow-lg shadow-indigo-500/30">
                ACT
            </div>
            <span class="text-xs uppercase font-extrabold tracking-widest text-slate-400">Pace Tracker</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="notif-btn" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-full transition-all border border-slate-700">
                <i class="fas fa-bell text-[11px]" id="notif-icon"></i>
                <span id="notif-text">Alerts</span>
            </button>
            <button id="install-btn" class="hidden items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-full transition-all shadow-md shadow-indigo-600/30">
                <i class="fas fa-download text-[10px]"></i> Install App
            </button>
        </div>
    </div>

    <!-- Header Section -->
    <header class="mb-6">
        <div class="flex items-center gap-2 text-indigo-400 text-xs font-bold uppercase tracking-wider mb-1">
            <span>UCC • 2026/2027</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">ACT 401: Survival Models</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Study Blocks: Mon, Thu & Fri • Lecturer: Mrs. Stella Omane Acheampong</p>
    </header>

    <!-- Progress Card -->
    <div class="glass-card rounded-2xl p-5 mb-6 shadow-2xl">
        <div class="flex justify-between items-baseline mb-3">
            <div>
                <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">Overall Course Completion</span>
                <div class="text-2xl font-black text-white mt-0.5" id="stats-count">0 of 0 completed</div>
            </div>
            <div id="stats-pct" class="text-xl font-black text-indigo-400">0%</div>
        </div>
        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>

    <!-- Milestones List -->
    <div id="milestones-container" class="space-y-6"></div>

<script>
    const schedule = [
        {
            milestoneTitle: "Milestone 1: Quiz 1 Prep",
            milestoneTag: "Weeks 1–3",
            tagColor: "amber",
            weeks: [
                {
                    weekTitle: "Week 1: Distribution of T & Functions",
                    items: [
                        { id: 1, title: "Survival Function S(t) & Cumulative Distribution F(t)", date: "Thu, Oct 29", type: "topic" },
                        { id: 2, title: "Probability Density Function f(t) & Hazard Rate λ(t)", date: "Fri, Oct 30", type: "topic" },
                        { id: 3, title: "Parametric Models: Uniform & Exponential Distributions", date: "Mon, Nov 2", type: "topic" }
                    ]
                },
                {
                    weekTitle: "Week 2: Extended Parametric Models",
                    items: [
                        { id: 4, title: "Gompertz Distribution & Makeham Distribution", date: "Thu, Nov 5", type: "topic" },
                        { id: 5, title: "Weibull Distribution & Other Survival Distributions", date: "Fri, Nov 6", type: "topic" },
                        { id: 6, title: "Practice Problem Set: Parametric Derivations & Properties", date: "Mon, Nov 9", type: "practice" }
                    ]
                },
                {
                    weekTitle: "Week 3: Truncation & Censoring",
                    items: [
                        { id: 7, title: "Censoring: Right, Left, and Interval Censoring Mechanisms", date: "Thu, Nov 12", type: "topic" },
                        { id: 8, title: "Truncation: Left and Right Truncation", date: "Fri, Nov 13", type: "topic" },
                        { id: 9, title: "🎯 Quiz 1 Review & Past Questions Drill (Weeks 1–3)", date: "Mon, Nov 16", type: "exam" }
                    ]
                }
            ]
        },
        {
            milestoneTitle: "Milestone 2: Quiz 2 Prep",
            milestoneTag: "Weeks 4–7",
            tagColor: "indigo",
            weeks: [
                {
                    weekTitle: "Weeks 4 & 5: Non-parametric Estimators",
                    items: [
                        { id: 10, title: "Kaplan–Meier Estimator (Product-Limit Estimator)", date: "Thu, Nov 19", type: "topic" },
                        { id: 11, title: "Kaplan–Meier Variance & Greenwood's Formula", date: "Fri, Nov 20", type: "topic" },
                        { id: 12, title: "Nelson–Aalen Estimator for Cumulative Hazard", date: "Mon, Nov 23", type: "topic" },
                        { id: 13, title: "Comparison & Practice: Kaplan–Meier vs. Nelson–Aalen", date: "Thu, Nov 26", type: "practice" }
                    ]
                },
                {
                    weekTitle: "Weeks 6 & 7: Estimation & MLE",
                    items: [
                        { id: 14, title: "Further Non-parametric Applications & Computational Drills", date: "Fri, Nov 27", type: "topic" },
                        { id: 15, title: "Maximum Likelihood Estimation (MLE) in Survival Models", date: "Mon, Nov 30", type: "topic" },
                        { id: 16, title: "Likelihood Functions with Censored & Truncated Data", date: "Thu, Dec 3", type: "topic" },
                        { id: 17, title: "🎯 Quiz 2 Review & Past Papers (Weeks 4–7)", date: "Fri, Dec 4", type: "exam" }
                    ]
                }
            ]
        },
        {
            milestoneTitle: "Milestone 3: Final Examination Prep",
            milestoneTag: "Weeks 8–11",
            tagColor: "violet",
            weeks: [
                {
                    weekTitle: "Weeks 8 & 9: Mortality Data Estimation",
                    items: [
                        { id: 18, title: "Survival Functions from Complete Mortality Data", date: "Mon, Dec 7", type: "topic" },
                        { id: 19, title: "Survival Functions from Incomplete Mortality Data", date: "Thu, Dec 10", type: "topic" },
                        { id: 20, title: "Moment Procedures & Actuarial Methods", date: "Fri, Dec 11", type: "topic" },
                        { id: 21, title: "Buffer & Problem Solving on Incomplete Data", date: "Mon, Dec 14", type: "practice" }
                    ]
                },
                {
                    weekTitle: "Weeks 10 & 11: Regression & Final Review",
                    items: [
                        { id: 22, title: "Cox Proportional Hazards Model Formulation", date: "Thu, Dec 17", type: "topic" },
                        { id: 23, title: "Partial Likelihood & Interpretation of Hazard Ratios", date: "Fri, Dec 18", type: "topic" },
                        { id: 24, title: "Comprehensive Course Review & Past Questions Drill", date: "Mon, Dec 21", type: "review" },
                        { id: 25, title: "🏁 End of Semester Exam Final Preparation", date: "Thu, Dec 24", type: "exam" }
                    ]
                }
            ]
        }
    ];

    let totalSessions = 0;
    schedule.forEach(m => m.weeks.forEach(w => totalSessions += w.items.length));

    let completed = JSON.parse(localStorage.getItem('act401_schedule_state')) || {};

    function render() {
        const container = document.getElementById('milestones-container');
        container.innerHTML = '';

        let doneCount = 0;

        schedule.forEach(milestone => {
            const section = document.createElement('section');
            section.className = 'glass-card rounded-2xl p-4 sm:p-5';

            const tagColorClasses = {
                amber: "text-amber-300 bg-amber-500/10 border-amber-500/20",
                indigo: "text-indigo-300 bg-indigo-500/10 border-indigo-500/20",
                violet: "text-violet-300 bg-violet-500/10 border-violet-500/20"
            }[milestone.tagColor] || "text-indigo-300 bg-indigo-500/10 border-indigo-500/20";

            const dotColor = {
                amber: "bg-amber-400",
                indigo: "bg-indigo-400",
                violet: "bg-violet-400"
            }[milestone.tagColor] || "bg-indigo-400";

            let weeksHtml = '';

            milestone.weeks.forEach(wk => {
                weeksHtml += `
                    <div class="pt-2">
                        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 pl-1">${wk.weekTitle}</div>
                        <div class="space-y-2">
                `;

                wk.items.forEach(item => {
                    const isDone = !!completed[item.id];
                    if (isDone) doneCount++;

                    const badgeStyle = isDone
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                        : item.type === 'practice' || item.type === 'review'
                        ? 'bg-indigo-500/15 text-indigo-300 border border-indigo-500/30'
                        : item.type === 'exam'
                        ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30'
                        : 'bg-slate-800 text-slate-400';

                    const badgeLabel = isDone ? 'Done' : item.date.split(',')[0];

                    weeksHtml += `
                        <div onclick="toggleItem(${item.id})" class="item-row rounded-xl p-3 sm:p-3.5 flex items-center justify-between gap-3 cursor-pointer select-none ${isDone ? 'completed' : ''}">
                            <div class="flex items-start gap-3 min-w-0">
                                <div class="mt-0.5 w-5 h-5 rounded-md flex-shrink-0 flex items-center justify-center border transition-all ${
                                    isDone ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-600 bg-slate-900/50 text-transparent'
                                }">
                                    <i class="fas fa-check text-[10px]"></i>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-xs sm:text-sm font-medium leading-snug ${isDone ? 'text-slate-400 line-through opacity-80' : 'text-slate-200'}">
                                        ${item.title}
                                    </span>
                                    <span class="text-[10px] font-semibold text-slate-400 mt-1 flex items-center gap-1">
                                        <i class="far fa-calendar-alt text-[9px] text-indigo-400"></i> ${item.date}
                                    </span>
                                </div>
                            </div>
                            <div class="flex-shrink-0">
                                <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${badgeStyle}">
                                    ${badgeLabel}
                                </span>
                            </div>
                        </div>
                    `;
                });

                weeksHtml += `</div></div>`;
            });

            section.innerHTML = `
                <div class="flex items-center justify-between pb-3 mb-2 border-b border-white/5">
                    <div>
                        <h2 class="text-sm font-bold text-white flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full ${dotColor}"></span>
                            ${milestone.milestoneTitle}
                        </h2>
                    </div>
                    <span class="text-[10px] font-bold border px-2.5 py-1 rounded-md ${tagColorClasses}">
                        ${milestone.milestoneTag}
                    </span>
                </div>
                <div class="space-y-3">
                    ${weeksHtml}
                </div>
            `;

            container.appendChild(section);
        });

        const pct = totalSessions > 0 ? Math.round((doneCount / totalSessions) * 100) : 0;
        document.getElementById('stats-count').textContent = `${doneCount} of ${totalSessions} sessions completed`;
        document.getElementById('stats-pct').textContent = `${pct}%`;
        document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function toggleItem(id) {
        completed[id] = !completed[id];
        localStorage.setItem('act401_schedule_state', JSON.stringify(completed));
        
        if (completed[id] && Notification.permission === 'granted') {
            triggerNotification('Session Completed! 🎯', 'Great pace! Your Survival Models progress has been updated.');
        }

        render();
    }

    render();

    // Register Service Worker for PWA
    let swRegistration = null;
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    swRegistration = reg;
                    checkStudyDayNotification();
                })
                .catch(err => console.log('SW registration failed:', err));
        });
    }

    // Install prompt handling
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove('hidden');
        installBtn.classList.add('flex');
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            installBtn.classList.add('hidden');
            installBtn.classList.remove('flex');
        }
        deferredPrompt = null;
    });

    // Notification System
    const notifBtn = document.getElementById('notif-btn');
    const notifText = document.getElementById('notif-text');
    const notifIcon = document.getElementById('notif-icon');

    function updateNotifBtnUI() {
        if (!('Notification' in window)) {
            notifBtn.classList.add('hidden');
            return;
        }
        if (Notification.permission === 'granted') {
            notifBtn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
            notifBtn.classList.add('bg-indigo-600/20', 'text-indigo-400', 'border-indigo-500/30');
            notifText.textContent = 'Active';
            notifIcon.className = 'fas fa-bell text-[11px]';
        } else {
            notifBtn.classList.remove('bg-indigo-600/20', 'text-indigo-400', 'border-indigo-500/30');
            notifBtn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
            notifText.textContent = 'Alerts';
            notifIcon.className = 'far fa-bell text-[11px]';
        }
    }

    notifBtn.addEventListener('click', async () => {
        if (!('Notification' in window)) {
            alert('Notifications are not supported by this browser.');
            return;
        }

        if (Notification.permission === 'default') {
            const permission = await Notification.requestPermission();
            updateNotifBtnUI();
            if (permission === 'granted') {
                triggerNotification('Survival Models Reminders On', 'You will receive study alerts on Mondays, Thursdays, and Fridays!');
            }
        } else if (Notification.permission === 'granted') {
            triggerNotification('Pace Check', 'Notifications are already enabled for your ACT 401 schedule.');
        } else {
            alert('Notifications are blocked in your browser settings. Enable them in site settings to receive reminders.');
        }
    });

    function triggerNotification(title, body) {
        if (swRegistration && 'showNotification' in swRegistration) {
            swRegistration.showNotification(title, {
                body: body,
                icon: 'https://cdn-icons-png.flaticon.com/512/3413/3413535.png',
                badge: 'https://cdn-icons-png.flaticon.com/512/3413/3413535.png'
            });
        } else if (Notification.permission === 'granted') {
            new Notification(title, { body: body });
        }
    }

    function checkStudyDayNotification() {
        if (Notification.permission !== 'granted') return;
        const dayOfWeek = new Date().getDay(); // 1 = Mon, 4 = Thu, 5 = Fri
        const todayKey = new Date().toDateString();
        const lastNotified = localStorage.getItem('sm_last_study_alert');

        if ([1, 4, 5].includes(dayOfWeek) && lastNotified !== todayKey) {
            triggerNotification('Survival Models Study Day 📖', 'Today is a scheduled ACT 401 study day. Check your tracker to see today’s focus!');
            localStorage.setItem('sm_last_study_alert', todayKey);
        }
    }

    updateNotifBtnUI();
</script>
</body>
</html>

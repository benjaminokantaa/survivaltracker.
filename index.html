<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Models - Pace App</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SM Tracker">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3413/3413535.png">

    <!-- Fonts & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(22, 30, 49, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .item-row {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-row:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }
        .item-row.completed {
            background: rgba(79, 70, 229, 0.12);
            border-color: rgba(99, 102, 241, 0.35);
        }
    </style>
</head>
<body class="p-4 sm:p-6 pb-20 max-w-xl mx-auto selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation / Install Action -->
    <div class="flex items-center justify-between py-3 mb-4">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-sm font-bold shadow-lg shadow-indigo-500/30">
                SM
            </div>
            <span class="text-xs uppercase font-extrabold tracking-widest text-slate-400">Pace Tracker</span>
        </div>
        <button id="install-btn" class="hidden items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-full transition-all shadow-md shadow-indigo-600/30">
            <i class="fas fa-download text-[10px]"></i> Install App
        </button>
    </div>

    <!-- Header Section -->
    <header class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Survival Models</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Study Schedule: Mondays, Thursdays & Fridays</p>
    </header>

    <!-- Progress Card -->
    <div class="glass-card rounded-2xl p-5 mb-6 shadow-2xl">
        <div class="flex justify-between items-baseline mb-3">
            <div>
                <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">Total Progress</span>
                <div class="text-2xl font-black text-white mt-0.5" id="stats-count">0 of 17 sessions completed</div>
            </div>
            <div id="stats-pct" class="text-xl font-black text-indigo-400">0%</div>
        </div>
        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>

    <!-- Milestones List -->
    <div id="milestones-container" class="space-y-6"></div>

<script>
    const schedule = [
        {
            milestoneTitle: "Milestone 1: Quiz 1 Prep",
            milestoneTag: "Target: Nov 5",
            tagColor: "amber",
            weeks: [
                {
                    weekTitle: "Week 1",
                    items: [
                        { id: 0, title: "Topic 1: Introduction to Survival Analysis", date: "Thu, Oct 22", type: "topic" },
                        { id: 1, title: "Topic 2: Survival Functions & Hazard Functions", date: "Fri, Oct 23", type: "topic" }
                    ]
                },
                {
                    weekTitle: "Week 2",
                    items: [
                        { id: 2, title: "Topic 3: Censoring and Truncation Mechanisms", date: "Mon, Oct 26", type: "topic" },
                        { id: 3, title: "Topic 4: Non-parametric Estimation (Kaplan-Meier)", date: "Thu, Oct 29", type: "topic" },
                        { id: 4, title: "Buffer & Practice Problems (Topics 1–4)", date: "Fri, Oct 30", type: "practice" }
                    ]
                },
                {
                    weekTitle: "Week 3",
                    items: [
                        { id: 5, title: "Quiz 1 Review & Past Papers", date: "Mon, Nov 2", type: "review" },
                        { id: 6, title: "🎯 Quiz 1 Target Date (Topics 1–4)", date: "Thu, Nov 5", type: "exam" }
                    ]
                }
            ]
        },
        {
            milestoneTitle: "Milestone 2: Quiz 2 Prep",
            milestoneTag: "Target: Nov 19",
            tagColor: "indigo",
            weeks: [
                {
                    weekTitle: "Week 3 (Continued)",
                    items: [
                        { id: 7, title: "Topic 5: Nelson-Aalen Estimator", date: "Fri, Nov 6", type: "topic" }
                    ]
                },
                {
                    weekTitle: "Week 4",
                    items: [
                        { id: 8, title: "Topic 6: Life Tables and Actuarial Estimators", date: "Mon, Nov 9", type: "topic" },
                        { id: 9, title: "Topic 7: Parametric Survival Distributions (Exponential)", date: "Thu, Nov 12", type: "topic" },
                        { id: 10, title: "Topic 8: Parametric Distributions (Weibull, Gompertz)", date: "Fri, Nov 13", type: "topic" }
                    ]
                },
                {
                    weekTitle: "Week 5",
                    items: [
                        { id: 11, title: "Quiz 2 Review & Problem Sets (Topics 5–8)", date: "Mon, Nov 16", type: "review" },
                        { id: 12, title: "🎯 Quiz 2 Target Date (Topics 5–8)", date: "Thu, Nov 19", type: "exam" }
                    ]
                }
            ]
        },
        {
            milestoneTitle: "Milestone 3: Final Review",
            milestoneTag: "Target: End of Nov",
            tagColor: "violet",
            weeks: [
                {
                    weekTitle: "Week 5 (Continued)",
                    items: [
                        { id: 13, title: "Topic 9: Proportional Hazards Models", date: "Fri, Nov 20", type: "topic" }
                    ]
                },
                {
                    weekTitle: "Week 6",
                    items: [
                        { id: 14, title: "Topic 10: Cox Proportional Hazards Regression", date: "Mon, Nov 23", type: "topic" },
                        { id: 15, title: "Topic 11: Assessing Model Fit and Diagnostics", date: "Thu, Nov 26", type: "topic" },
                        { id: 16, title: "Topic 12: Accelerated Failure Time Models", date: "Fri, Nov 27", type: "topic" }
                    ]
                },
                {
                    weekTitle: "Week 7",
                    items: [
                        { id: 17, title: "Topic 13: Competing Risks and Multi-state Models", date: "Mon, Nov 30", type: "topic" }
                    ]
                }
            ]
        }
    ];

    const totalSessions = 18;
    let completed = JSON.parse(localStorage.getItem('sm_full_schedule_state')) || {};

    function render() {
        const container = document.getElementById('milestones-container');
        container.innerHTML = '';

        let doneCount = 0;

        schedule.forEach(milestone => {
            const section = document.createElement('section');
            section.className = 'glass-card rounded-2xl p-4 sm:p-5';

            const tagColorClasses = {
                amber: "text-amber-300 bg-amber-500/10 border-amber-500/20",
                indigo: "text-indigo-300 bg-indigo-500/10 border-indigo-500/20",
                violet: "text-violet-300 bg-violet-500/10 border-violet-500/20"
            }[milestone.tagColor] || "text-indigo-300 bg-indigo-500/10 border-indigo-500/20";

            const dotColor = {
                amber: "bg-amber-400",
                indigo: "bg-indigo-400",
                violet: "bg-violet-400"
            }[milestone.tagColor] || "bg-indigo-400";

            let weeksHtml = '';

            milestone.weeks.forEach(wk => {
                weeksHtml += `
                    <div class="pt-2">
                        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 pl-1">${wk.weekTitle}</div>
                        <div class="space-y-2">
                `;

                wk.items.forEach(item => {
                    const isDone = !!completed[item.id];
                    if (isDone) doneCount++;

                    const badgeStyle = isDone
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                        : item.type === 'practice' || item.type === 'review'
                        ? 'bg-indigo-500/15 text-indigo-300 border border-indigo-500/30'
                        : item.type === 'exam'
                        ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30'
                        : 'bg-slate-800 text-slate-400';

                    const badgeLabel = isDone ? 'Done' : item.date.split(',')[0];

                    weeksHtml += `
                        <div onclick="toggleItem(${item.id})" class="item-row rounded-xl p-3 sm:p-3.5 flex items-center justify-between gap-3 cursor-pointer select-none ${isDone ? 'completed' : ''}">
                            <div class="flex items-start gap-3 min-w-0">
                                <div class="mt-0.5 w-5 h-5 rounded-md flex-shrink-0 flex items-center justify-center border transition-all ${
                                    isDone ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-600 bg-slate-900/50 text-transparent'
                                }">
                                    <i class="fas fa-check text-[10px]"></i>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-xs sm:text-sm font-medium leading-snug ${isDone ? 'text-slate-400 line-through opacity-80' : 'text-slate-200'}">
                                        ${item.title}
                                    </span>
                                    <span class="text-[10px] font-semibold text-slate-400 mt-1 flex items-center gap-1">
                                        <i class="far fa-calendar-alt text-[9px] text-indigo-400"></i> ${item.date}
                                    </span>
                                </div>
                            </div>
                            <div class="flex-shrink-0">
                                <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${badgeStyle}">
                                    ${badgeLabel}
                                </span>
                            </div>
                        </div>
                    `;
                });

                weeksHtml += `</div></div>`;
            });

            section.innerHTML = `
                <div class="flex items-center justify-between pb-3 mb-2 border-b border-white/5">
                    <div>
                        <h2 class="text-sm font-bold text-white flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full ${dotColor}"></span>
                            ${milestone.milestoneTitle}
                        </h2>
                    </div>
                    <span class="text-[10px] font-bold border px-2.5 py-1 rounded-md ${tagColorClasses}">
                        ${milestone.milestoneTag}
                    </span>
                </div>
                <div class="space-y-3">
                    ${weeksHtml}
                </div>
            `;

            container.appendChild(section);
        });

        const pct = Math.round((doneCount / totalSessions) * 100);
        document.getElementById('stats-count').textContent = `${doneCount} of ${totalSessions} sessions completed`;
        document.getElementById('stats-pct').textContent = `${pct}%`;
        document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function toggleItem(id) {
        completed[id] = !completed[id];
        localStorage.setItem('sm_full_schedule_state', JSON.stringify(completed));
        render();
    }

    render();

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        });
    }

    // Install prompt handling
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove('hidden');
        installBtn.classList.add('flex');
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            installBtn.classList.add('hidden');
            installBtn.classList.remove('flex');
        }
        deferredPrompt = null;
    });
</script>
</body>
</html>

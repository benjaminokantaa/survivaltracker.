<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Models - Pace App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="font-sans text-slate-800">

<div class="max-w-2xl mx-auto py-8 px-4">
    <!-- Header -->
    <header class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-indigo-700 tracking-tight mb-2">Survival Models Tracker</h1>
        <p class="text-slate-500 font-medium text-sm">Track your study pace to ace your quizzes & exams.</p>
    </header>

    <!-- Progress Overview -->
    <div class="bg-white rounded-3xl shadow-xl shadow-indigo-100/70 p-6 mb-6 border border-white">
        <div class="flex justify-between items-end mb-3">
            <div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Overall Progress</p>
                <h2 id="overall-text" class="text-3xl font-extrabold text-indigo-900">0/13 Topics</h2>
            </div>
            <div id="percentage-badge" class="bg-indigo-100 text-indigo-700 rounded-full px-3 py-1 text-xs font-bold">
                0%
            </div>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden shadow-inner">
            <div id="progress-bar" class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
    </div>

    <!-- Milestones -->
    <div class="space-y-5">
        <!-- Quiz 1 -->
        <div class="bg-white/80 backdrop-blur-md rounded-3xl border border-white shadow-lg p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-indigo-900 flex items-center gap-2">
                    <span class="bg-indigo-100 text-indigo-600 w-7 h-7 flex items-center justify-center rounded-xl text-xs font-bold">Q1</span>
                    Quiz 1 (Topics 1-4)
                </h3>
                <span class="text-xs font-bold text-white bg-indigo-500 rounded-full px-3 py-1">Due: Nov 5</span>
            </div>
            <div id="milestone-1" class="space-y-3"></div>
        </div>

        <!-- Quiz 2 -->
        <div class="bg-white/80 backdrop-blur-md rounded-3xl border border-white shadow-lg p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-indigo-900 flex items-center gap-2">
                    <span class="bg-indigo-100 text-indigo-600 w-7 h-7 flex items-center justify-center rounded-xl text-xs font-bold">Q2</span>
                    Quiz 2 (Topics 5-8)
                </h3>
                <span class="text-xs font-bold text-white bg-indigo-500 rounded-full px-3 py-1">Due: Nov 19</span>
            </div>
            <div id="milestone-2" class="space-y-3"></div>
        </div>

        <!-- Final Exam -->
        <div class="bg-white/80 backdrop-blur-md rounded-3xl border border-white shadow-lg p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-indigo-900 flex items-center gap-2">
                    <span class="bg-indigo-100 text-indigo-600 w-7 h-7 flex items-center justify-center rounded-xl text-xs font-bold">EX</span>
                    Exam Review (Topics 9-13)
                </h3>
                <span class="text-xs font-bold text-white bg-indigo-500 rounded-full px-3 py-1">Due: End of Nov</span>
            </div>
            <div id="milestone-3" class="space-y-3"></div>
        </div>
    </div>
</div>

<script>
    const totalTopics = 13;
    let completedTopics = JSON.parse(localStorage.getItem('survivalModelsProgress')) || Array(totalTopics).fill(false);

    const topics = [
        "Topic 1: Introduction to Survival Analysis",
        "Topic 2: Survival Functions & Hazard Functions",
        "Topic 3: Censoring and Truncation Mechanisms",
        "Topic 4: Non-parametric Estimation (Kaplan-Meier)",
        "Topic 5: Nelson-Aalen Estimator",
        "Topic 6: Life Tables and Actuarial Estimators",
        "Topic 7: Parametric Survival Distributions (Exponential)",
        "Topic 8: Parametric Distributions (Weibull, Gompertz)",
        "Topic 9: Proportional Hazards Models",
        "Topic 10: Cox Proportional Hazards Regression",
        "Topic 11: Assessing Model Fit and Diagnostics",
        "Topic 12: Accelerated Failure Time Models",
        "Topic 13: Competing Risks and Multi-state Models"
    ];

    function renderApp() {
        const milestone1Container = document.getElementById('milestone-1');
        const milestone2Container = document.getElementById('milestone-2');
        const milestone3Container = document.getElementById('milestone-3');

        milestone1Container.innerHTML = '';
        milestone2Container.innerHTML = '';
        milestone3Container.innerHTML = '';

        topics.forEach((topic, index) => {
            const isChecked = completedTopics[index];
            const topicElement = createTopicElement(index, isChecked);

            if (index < 4) {
                milestone1Container.appendChild(topicElement);
            } else if (index < 8) {
                milestone2Container.appendChild(topicElement);
            } else {
                milestone3Container.appendChild(topicElement);
            }
        });

        updateOverallProgress();
        localStorage.setItem('survivalModelsProgress', JSON.stringify(completedTopics));
    }

    function createTopicElement(index, isChecked) {
        const row = document.createElement('label');
        row.className = `flex items-center gap-3 p-3.5 rounded-xl cursor-pointer transition-all duration-200 border ${
            isChecked ? 'bg-indigo-50/70 border-indigo-200' : 'bg-white border-slate-100 hover:border-indigo-100'
        }`;

        const checkboxInput = document.createElement('input');
        checkboxInput.type = 'checkbox';
        checkboxInput.checked = isChecked;
        checkboxInput.className = 'w-5 h-5 flex-shrink-0 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer';

        checkboxInput.addEventListener('change', () => {
            completedTopics[index] = checkboxInput.checked;
            renderApp();
        });

        const textSpan = document.createElement('span');
        textSpan.className = `flex-1 text-sm font-semibold leading-snug ${isChecked ? 'text-indigo-900 line-through opacity-75' : 'text-slate-700'}`;
        textSpan.textContent = topics[index];

        const iconContainer = document.createElement('div');
        iconContainer.className = `w-6 h-6 flex-shrink-0 rounded-full flex items-center justify-center transition-colors ${
            isChecked ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-300'
        }`;
        
        const icon = document.createElement('i');
        icon.className = 'fas fa-check text-xs';
        iconContainer.appendChild(icon);

        row.appendChild(checkboxInput);
        row.appendChild(textSpan);
        row.appendChild(iconContainer);

        return row;
    }

    function updateOverallProgress() {
        const completedCount = completedTopics.filter(Boolean).length;
        const percentage = Math.round((completedCount / totalTopics) * 100);

        document.getElementById('progress-bar').style.width = `${percentage}%`;
        document.getElementById('overall-text').textContent = `${completedCount}/${totalTopics} Topics`;
        document.getElementById('percentage-badge').textContent = `${percentage}%`;
    }

    renderApp();
</script>

</body>
</html>
